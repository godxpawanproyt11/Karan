name: Python Danger Bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: tenki-standard-medium-4c-8g

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install Dependencies
        run: |
          pip install telebot pymongo pytz certifi requests aiohttp psutil

      - name: 🔓 Give Execute Permission
        run: |
          chmod +x soul

      - name: 🚀 Run Danger.py
        run: |
          python3 Danger.py